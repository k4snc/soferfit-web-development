services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: soferfit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "soferfit"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build: .
    command: ["./entrypoint.sh"]
    environment:
      # This Compose file is for local development. Production mode enables
      # mandatory SMTP, HTTPS CORS, allowed-host, and deployment checks.
      DJANGO_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DB_NAME: soferfit
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      CORS_ALLOW_ALL_ORIGINS: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
