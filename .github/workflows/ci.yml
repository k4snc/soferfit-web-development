name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soferfit
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d soferfit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHON_DOTENV_DISABLED: "true"
      DJANGO_ENV: test
      DJANGO_SECRET_KEY: "ci-only-not-a-production-secret"
      DJANGO_DEBUG: "false"
      DB_NAME: soferfit
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      PLAYWRIGHT_WORKERS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
        working-directory: src/backend
      - run: python manage.py check
        working-directory: src/backend
      - run: python manage.py test --noinput
        working-directory: src/backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: src/backend
      - name: Verify production rejects missing PostgreSQL configuration
        working-directory: src/backend
        run: |
          if env -u DB_NAME -u DB_USER -u DB_PASSWORD -u DB_HOST \
            DJANGO_ENV=production \
            DJANGO_DEBUG=false \
            DJANGO_SECRET_KEY="ci-only-production-check-not-a-secret-for-configuration-validation" \
            DJANGO_ALLOWED_HOSTS="api.example.test" \
            CORS_ALLOWED_ORIGINS="https://app.example.test" \
            EMAIL_HOST="smtp.example.test" \
            DEFAULT_FROM_EMAIL="noreply@example.test" \
            python manage.py check; then
            echo "Production settings accepted missing PostgreSQL configuration."
            exit 1
          fi
      - run: python manage.py check --deploy --fail-level ERROR
        working-directory: src/backend
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-production-check-not-a-secret-for-configuration-validation"
          DJANGO_ALLOWED_HOSTS: "api.example.test"
          CORS_ALLOWED_ORIGINS: "https://app.example.test"
          DB_NAME: soferfit
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/1
          EMAIL_HOST: "smtp.example.test"
          DEFAULT_FROM_EMAIL: "noreply@example.test"

      - run: npx playwright install --with-deps chromium
      - name: Run full-stack browser tests
        working-directory: src/backend
        env:
          CORS_ALLOWED_ORIGINS: "http://localhost:5173"
          VITE_API_URL: "http://127.0.0.1:8000/api"
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 > "$RUNNER_TEMP/soferfit-django.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          backend_ready=false
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8000/api/me/; then
              backend_ready=true
              break
            fi
            sleep 1
          done

          if [ "$backend_ready" != true ]; then
            cat "$RUNNER_TEMP/soferfit-django.log"
            exit 1
          fi

          cd ../..
          npx playwright test
